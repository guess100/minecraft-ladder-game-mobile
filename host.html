<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>진행 화면 · 팀 대항 오락실</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/host.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">🎮</div>
      <div id="title" title="눌러서 행사 이름 바꾸기"></div>
      <span id="phase"></span>
      <span class="grow"></span>
      <span id="netstat" class="netstat"></span>
      <div id="mini-qr" title="참가 QR 크게 보기 (Q)"><div id="mini-qr-svg"></div><div><small>참가 코드</small><span id="mini-code"></span></div></div>
      <button class="tb-btn" id="snd" title="소리 켜기/끄기"></button>
      <button class="tb-btn" id="full" title="전체 화면 (F)">⛶</button>
    </header>
    <main id="main"></main>
    <footer id="foot"></footer>
  </div>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/net.js"></script>
  <script src="js/games.js"></script>
  <script src="js/host.js"></script>
</body>
</html>
