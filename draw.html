<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경품 추첨 · 팀 대항 오락실</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/draw.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="index.html" title="처음으로">🎁</a>
      <div class="ttl">경품 추첨</div>
      <span class="grow"></span>
      <button class="tb-btn" id="toggle" title="설정 패널 숨기기/보이기 (H)">☰ 설정</button>
      <button class="tb-btn" id="snd"></button>
      <button class="tb-btn" id="full" title="전체 화면">⛶</button>
    </header>
    <div class="body">
      <aside id="panel">
        <section>
          <div class="sh"><b>1. 참가자</b> <span id="name-count" class="pill"></span> <button class="mini" id="fill-num">번호로 채우기</button></div>
          <textarea id="names" rows="7" placeholder="이름이나 번호를 한 줄에 하나씩&#10;(엑셀에서 복사해 붙여넣기 OK)&#10;홍길동&#10;김철수&#10;..."></textarea>
        </section>
        <section>
          <div class="sh"><b>2. 경품 (위에서부터 차례로)</b> <span id="prize-count" class="pill"></span></div>
          <textarea id="prizes" rows="5" placeholder="한 줄에 하나, 여러 개면 x숫자&#10;커피 쿠폰 x5&#10;3등 상품권&#10;2등 블루투스 스피커&#10;1등 태블릿"></textarea>
          <label class="check"><input type="checkbox" id="exclude" /> 당첨된 사람은 다음 추첨에서 제외</label>
        </section>
        <section>
          <div class="sh"><b>3. 추첨 방법</b></div>
          <div id="methods" class="methods"></div>
        </section>
        <section class="grow-sec">
          <div class="sh"><b>당첨자</b> <button class="mini" id="copy">📋 엑셀로 복사</button> <button class="mini danger" id="reset">다시 시작</button></div>
          <div id="winners" class="winners"></div>
        </section>
      </aside>
      <main>
        <div id="stage"></div>
        <div id="bar"></div>
      </main>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/draw.js"></script>
</body>
</html>
